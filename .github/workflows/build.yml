name: Apps bauen

# Gebaut wird nur auf ausdrückliche Ansage:
#  - Hochladen auf den Zweig "release" (Version aus package.json),
#  - eine Versionsmarke wie v1.1.0,
#  - oder "Run workflow" mit Versionsnummer.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 1.1.0'
        required: true

permissions:
  contents: write

env:
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer bestimmen
        id: ver
        run: |
          V="${APP_VERSION#v}"
          [ -z "$V" ] && V=$(node -p "require('./package.json').version")
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Ungültige Versionsnummer: $V (erwartet z. B. 1.1.0)"; exit 1; }
          IFS=. read MA MI PA <<< "$V"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Web-Oberfläche bauen
        run: npm run build:web
      - name: Firebase für Android einbinden
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json eingebunden, Google-Anmeldung aktiv."
          else
            echo "Keine google-services.json: Google-Anmeldung wird in diesem Build weggelassen."
            node -e "const f='capacitor.config.json';const c=JSON.parse(require('fs').readFileSync(f));c.includePlugins=['@capacitor/app'];require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi
      - name: Capacitor synchronisieren
        run: npx cap sync android
      - name: Signierschlüssel bereitstellen
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sudoku.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sudoku.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signierschlüssel hinterlegt. Es wird eine Debug-APK gebaut."
          fi
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          TASK=assembleDebug; [ -n "$ANDROID_KEYSTORE_PATH" ] && TASK=assembleRelease
          set +e
          ./gradlew $TASK --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          RC=$?
          set -e
          tail -n 200 "$RUNNER_TEMP/gradle.log"
          if [ $RC -ne 0 ]; then
            # Fehlerursache als Hinweis am Lauf sichtbar machen
            MSG=$(grep -A 12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -n 30 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            [ -z "$MSG" ] && MSG=$(grep -iE "error|exception" "$RUNNER_TEMP/gradle.log" | head -n 20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Gradle::$MSG"
            exit $RC
          fi
          if [ "$TASK" = assembleRelease ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/master-sudoku-${APP_VERSION}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/master-sudoku-${APP_VERSION}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/master-sudoku-*.apk
          if-no-files-found: error

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Versionsnummer setzen
        shell: pwsh
        run: |
          $v = "$env:APP_VERSION".TrimStart('v')
          if (-not $v) { $v = (Get-Content package.json -Raw | ConvertFrom-Json).version }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Ungültige Versionsnummer: $v"; exit 1 }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $f = 'src-tauri/tauri.conf.json'
          $c = Get-Content $f -Raw | ConvertFrom-Json
          $c.version = $v
          $c | ConvertTo-Json -Depth 20 | Set-Content $f -Encoding utf8
      - name: Windows-App bauen
        run: npx tauri build
      - name: Installer einsammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "out/master-sudoku-$env:APP_VERSION-setup.exe" }
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object { Copy-Item $_ "out/master-sudoku-$env:APP_VERSION.msi" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Versionsnummer übernehmen
        run: echo "APP_VERSION=${{ needs.android.outputs.version }}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Master Sudoku ${{ env.APP_VERSION }}
          body: |
            Gebaut aus ${{ github.sha }}.
            Android: die .apk-Datei auf dem Handy oder Tablet herunterladen und öffnen.
            Windows: die setup.exe herunterladen und ausführen.
          files: files/*
